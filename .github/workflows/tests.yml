name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test extra
        run: python -m pip install -e ".[test]"
      - name: Run offline test suite
        run: python -m unittest discover -v

  kissterm-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bradbrownjr/kissterm
          ref: f3310c71efa8e3e23263ed25745a9c365a9efc74
          path: reference-kissterm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Federated CMS and kissterm dependencies
        run: python -m pip install -e . ./reference-kissterm
      - name: Test real kissterm client offline
        env:
          FCMS_KISSTERM_PATH: ${{ github.workspace }}/reference-kissterm
        run: python -m unittest tests.test_b2f.B2FLabTests.test_kissterm_bidirectional_roundtrip tests.test_b2f_recovery -v

  pat-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: la5nta/pat
          ref: 2ad31e8fc1f1748ac1b00cac9d88da54e3e0efe2
          path: reference-pat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference-pat/go.mod
          cache-dependency-path: reference-pat/go.sum
      - name: Build Pat
        working-directory: reference-pat
        run: go build -o "$RUNNER_TEMP/pat-lab" .
      - name: Install Federated CMS
        run: python -m pip install -e .
      - name: Test Pat over localhost
        env:
          FCMS_PAT_BINARY: ${{ runner.temp }}/pat-lab
        run: python -m unittest tests.test_pat_interop -v

  rmsgw-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nwdigitalradio/rmsgw
          ref: 3147f017545f43c4b83ef6a037b8b0e38d0719af
          path: reference-rmsgw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exercise upstream login routine over local socket pairs
        env:
          FCMS_RMSGW_SOURCE: ${{ github.workspace }}/reference-rmsgw
        run: python -m unittest tests.test_rmsgw_login -v
